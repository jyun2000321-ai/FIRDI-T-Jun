<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加工溫度履歷 - 階層化儀表板</title>
    <style>
        :root {
            --primary: #2c3e50;
            --stage-a: #e67e22;
            --stage-b: #2ecc71;
            --stage-c: #9b59b6;
            --fail: #e74c3c;
            --pass: #27ae60;
            --bg: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 30px;
        }

        .flowchart-section {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        .flowchart-section img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stage-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border-top: 8px solid #ccc;
            text-align: center;
        }

        .stage-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .stage-card.active {
            box-shadow: 0 0 0 3px var(--primary);
        }

        .card-a { border-top-color: var(--stage-a); }
        .card-b { border-top-color: var(--stage-b); }
        .card-c { border-top-color: var(--stage-c); }

        .card-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
        }

        .stat-item .label { font-size: 0.9rem; color: #666; }
        .stat-item .value { font-size: 1.2rem; font-weight: bold; display: block; }
        .val-pass { color: var(--pass); }
        .val-fail { color: var(--fail); }

        .detail-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: none; /* Hidden by default */
        }

        .detail-section.visible { display: block; }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th { background: #f4f4f4; color: #555; }

        .alert-icon {
            font-size: 1.2rem;
            margin-right: 5px;
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .status-pass { background: #eafaf1; color: var(--pass); }
        .status-fail { background: #fdeaea; color: var(--fail); }

        .temp-warning {
            color: var(--fail);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>加工溫度履歷一頁看 (進階版)</h1>

    <div class="flowchart-section">
        <h3>生產製程參考圖</h3>
        <!-- Note: This assumes the PNG is in the same directory -->
        <img src="visual selection.png" alt="製程流程圖">
    </div>

    <div class="summary-grid">
        <div class="stage-card card-a" onclick="showDetail('A')">
            <div class="card-title">製程段 A</div>
            <div class="stats">
                <div class="stat-item"><span class="label">總筆數</span><span class="value" id="count-a">0</span></div>
                <div class="stat-item"><span class="label">不合規</span><span class="value val-fail" id="fail-a">0</span></div>
            </div>
            <p style="color: #888; margin-top: 15px;">點擊查看詳情</p>
        </div>
        <div class="stage-card card-b" onclick="showDetail('B')">

            </div>
            <p style="color: #888; margin-top: 15px;">點擊查看詳情</p>
        </div>
    </div>

    <div id="detailContainer" class="detail-section">
        <div class="detail-header">
            <h2 id="detailTitle">詳細數據 - 製程段</h2>

        <table id="detailTable">

                    <th>溫度 (°C)</th>

                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

    const dataByStage = { A: [], B: [], C: [] };
    const stats = { A: { total: 0, fail: 0 }, B: { total: 0, fail: 0 }, C: { total: 0, fail: 0 } };

    function initData() {
        const lines = csvData.split('\n');
        const headers = lines[0].split(',');
        for (let i = 1; i < lines.length; i++) {
            const parts = lines[i].split(',');
            if (parts.length < 5) continue;
            const row = {
                date: parts[0],
                batch: parts[1],
                stage: parts[2],
                temp: parseFloat(parts[3]),
                time: parts[4]
            };
            
            // Compliance check (2.0 - 7.0)
            row.isPass = !isNaN(row.temp) && row.temp >= 2.0 && row.temp <= 7.0;
            
            if (dataByStage[row.stage]) {
                dataByStage[row.stage].push(row);
                stats[row.stage].total++;
                if (!row.isPass) stats[row.stage].fail++;
            }
        }

        // Update Summary Cards
        ['A', 'B', 'C'].forEach(s => {
            document.getElementById(`count-${s.toLowerCase()}`).innerText = stats[s].total;
            document.getElementById(`fail-${s.toLowerCase()}`).innerText = stats[s].fail;
        });
    }

    function showDetail(stage) {
        // Toggle UI
        document.querySelector('.summary-grid').style.display = 'none';
        const container = document.getElementById('detailContainer');
        container.classList.add('visible');
        document.getElementById('detailTitle').innerText = `詳細數據 - 製程段 ${stage}`;

        const tbody = document.querySelector('#detailTable tbody');
        tbody.innerHTML = '';

        dataByStage[stage].forEach(row => {
            const tr = document.createElement('tr');
            const statusHtml = row.isPass 
                ? `<span class="status-badge status-pass">✅ 合規</span>`
                : `<span class="status-badge status-fail"><span class="alert-icon">⚠️</span>不合規</span>`;
            
            const tempDisplay = row.isPass 
                ? `<span>${row.temp || 'N/A'}</span>`
                : `<span class="temp-warning">${row.temp || 'N/A'}</span>`;

            tr.innerHTML = `
                <td>${row.date || '-'}</td>
                <td><strong>${row.batch}</strong></td>
                <td>${row.time}</td>
                <td>${tempDisplay}</td>
                <td>${statusHtml}</td>
            `;
            tbody.appendChild(tr);
        });

        // Scroll to detail
        container.scrollIntoView({ behavior: 'smooth' });
    }

    function hideDetail() {
        document.getElementById('detailContainer').classList.remove('visible');
        document.querySelector('.summary-grid').style.display = 'grid';
    }

    initData();
</script>
